[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.127.1",
    "google-auth>=2.29.0",
    "modal>=1.3.0.post1",
    "openai>=1.0.0",
    "passlib[bcrypt]>=1.7.4",
    "requests>=2.32.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.21",
    "sqlmodel>=0.0.30",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=7.1.0",
    "mutmut>=3.7.0",
    "radon>=6.0.1",
    "coverage>=7.16.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "B008",   # Do not perform function call `Depends` in argument defaults (FastAPI idiom)
    "E501",   # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["auth", "database", "models", "routers", "ai_service", "llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".git", ".venv", "mutants", ".mutmut-cache", "__pycache__"]

[tool.mutmut]
source_paths = ["database.py"]
also_copy = ["models.py", "auth.py", "main.py", "ai_service.py", "routers"]
debug = false

