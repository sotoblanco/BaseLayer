name: Test & Quality Gate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-tests:
    name: Backend Tests, Ruff & CRAP Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install Backend Dependencies
        working-directory: backend
        run: uv sync --dev

      - name: Ruff Format Check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Ruff Linter Check
        working-directory: backend
        run: uv run ruff check .

      - name: Run Pytest & Coverage Check
        working-directory: backend
        run: |
          uv run pytest --cov=auth --cov=routers.file_courses --cov=models --cov=database --cov-fail-under=90 -v

      - name: Run CRAP Analyzer (Threshold < 6.0)
        working-directory: backend
        run: |
          uv run python scripts/crap_analyzer.py auth.py database.py models.py routers/file_courses.py

  frontend-check:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Frontend (TypeScript + Vite)
        working-directory: frontend
        run: npm run build

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint
