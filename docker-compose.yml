# =============================================================================
# Docker Compose for BaseLayer Development
#
# Security notes:
#   - Backend and frontend run as non-root users inside their containers.
#   - Secrets are loaded from .env.docker (not hardcoded).
#   - Containers communicate on an internal network; only ports 5173/8000
#     are exposed to the host.
#   - The Docker socket is NOT mounted (removed for security).
#     Code execution uses the remote Modal sandbox in production.
# =============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot-reload during development
      - ./backend:/app
      # Mount courses directory so file-based courses are available
      - ./courses:/courses:ro
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=sqlite:///database.db
      - COURSES_DIR=/courses
      - ALLOW_LOCAL_WELCOME=true
    networks:
      - baselayer-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot-reload during development
      - ./frontend:/app
      # Prevent host node_modules from overriding the container's
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
      - VITE_GOOGLE_CLIENT_ID=816844223678-1dh0td3bc0mv3aj4dhanlnm1ubldc6ah.apps.googleusercontent.com
    depends_on:
      - backend
    networks:
      - baselayer-net
    restart: unless-stopped

networks:
  baselayer-net:
    driver: bridge
